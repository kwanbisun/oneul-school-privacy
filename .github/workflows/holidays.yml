name: Update holidays and publish Pages
on:
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * 0'
  push:
    branches: [main]
    paths: [index.html, holidays.json, scripts/**, .github/workflows/holidays.yml]
permissions:
  contents: read
concurrency:
  group: public-holiday-pages
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Test feed builder
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Fetch official public holidays
        if: github.event_name != 'push'
        env:
          KASI_SERVICE_KEY: ${{ secrets.KASI_SERVICE_KEY }}
        run: python3 scripts/update_holidays.py --feed holidays.json
      - name: Preserve public feed revision
        if: github.event_name != 'push'
        run: |
          if ! git diff --quiet -- holidays.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add holidays.json
            git commit -m 'Update verified public holiday data'
            git push
          fi
      - name: Stage only public website files
        run: |
          mkdir public-site
          cp index.html holidays.json .nojekyll public-site/
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public-site
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public files
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
